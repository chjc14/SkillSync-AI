

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync AI | Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800/50 p-8 rounded-3xl shadow-2xl border border-slate-700 w-full max-w-md backdrop-blur-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent mb-2">
                <i class="fas fa-bolt mr-2"></i>SkillSync AI
            </h1>
            <p class="text-slate-400 text-sm">Master Your Next Interview</p>
        </div>

        <div class="flex bg-slate-900/50 rounded-full p-1 mb-8">
            <button id="toggle-login" class="flex-1 py-2 rounded-full text-sm font-bold transition-all bg-blue-600 text-white shadow-lg">Login</button>
            <button id="toggle-signup" class="flex-1 py-2 rounded-full text-sm font-bold text-slate-400 hover:text-white transition-all">Sign Up</button>
        </div>

        <form id="login-form" class="space-y-4">
            <input type="email" id="login-email" placeholder="Email Address" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition-colors">
            <input type="password" id="login-password" placeholder="Password" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition-colors">
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition-all">Access Dashboard</button>
        </form>

        <form id="signup-form" class="space-y-4 hidden">
            <input type="text" id="signup-username" placeholder="Full Name" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition-colors">
            <input type="email" id="signup-email" placeholder="Enter an Email" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition-colors">
            <input type="password" id="signup-password" placeholder="Create a Password" required minlength="6" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition-colors">
            <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition-all">Create Account</button>
        </form>
    </div>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
