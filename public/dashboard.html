<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync AI | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen relative flex flex-col">

    <div id="page-loader" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
    </div>

    <div id="app-content" class="hidden flex-grow flex flex-col opacity-0 transition-opacity duration-700">
        <div id="history-sidebar" class="fixed left-0 top-0 h-full w-72 bg-slate-800 border-r border-slate-700 p-6 transform -translate-x-full transition-transform duration-300 z-50">
            <div class="flex justify-between items-center mb-8">
                <h3 class="font-bold text-blue-400 uppercase tracking-widest text-sm">Scan History</h3>
                <button onclick="toggleSidebar()" class="text-slate-400 p-2"><i class="fas fa-times"></i></button>
            </div>
            <div id="history-list" class="space-y-4 overflow-y-auto h-[85%] pr-2"></div>
        </div>

        <button onclick="toggleSidebar()" class="fixed left-6 bottom-6 bg-blue-600 text-white p-4 rounded-full shadow-lg z-40"><i class="fas fa-history"></i></button>

        <nav class="p-6 border-b border-slate-800 backdrop-blur-md sticky top-0 z-30 bg-slate-900/80">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent"><i class="fas fa-bolt"></i> SkillSync AI</h1>
                <button id="btn-logout" class="text-slate-400 hover:text-red-400 font-bold px-4 py-2 rounded-xl">Logout</button>
            </div>
        </nav>

        <main class="container mx-auto px-6 py-12 flex-grow flex flex-col justify-center max-w-4xl">
            <div class="text-center mb-16">
                <h2 id="user-greeting" class="text-4xl md:text-7xl font-black text-white tracking-tight uppercase">Hello, User</h2>
                <div class="h-2 w-32 bg-gradient-to-r from-blue-500 to-emerald-500 mx-auto mt-8 rounded-full"></div>
            </div>

            <div class="bg-slate-800/20 border border-slate-700/50 rounded-[2.5rem] p-12 text-center backdrop-blur-sm relative overflow-hidden group">
                <h3 class="text-3xl font-bold mb-4">Sync Your Career</h3>
                <p class="text-slate-400 mb-10 text-lg">Submit resume to unlock compatibility score and 7-day learning sprint.</p>
                <button onclick="window.location.href='analyze.html'" class="bg-blue-600 hover:bg-blue-500 text-white text-xl font-black px-14 py-6 rounded-2xl transition-all active:scale-95">Analyze My Resume</button>
            </div>
        </main>
    </div>
    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
    function toggleSidebar() {
        const sidebar = document.getElementById('history-sidebar');
        if (sidebar) {
            sidebar.classList.toggle('translate-x-0');
            sidebar.classList.toggle('-translate-x-full');
        }
    }
</script>
</body>
</html>
